# Build + publish a npm en cada tag vX.Y.Z.
#
# Autenticación: OIDC Trusted Publishing — NO usamos NPM_TOKEN.
# La confianza se configura una sola vez en npm:
#   Package → Settings → Trusted Publisher → GitHub Actions →
#     LautaroTiamat/PrinklyPrint.js · publish.yml · Allow npm publish
#
# Cómo funciona: cuando el workflow corre, GitHub firma un token efímero
# que dice "soy publish.yml del repo X corriendo el commit Y". npm verifica
# esa firma contra la confianza configurada y autoriza el publish. El token
# vive ~10 min y no se puede reusar. No hay secret en el repo.
#
# Para publicar una versión:
#   1) Bumpeá "version" en package.json.
#   2) Agregá la entry al CHANGELOG.md.
#   3) git tag v1.1.0 && git push origin v1.1.0
#
# El workflow valida que el tag matchee la version del package.json para
# evitar drift entre lo publicado y lo etiquetado.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # crear el GitHub Release
  id-token: write   # ← clave: emite el OIDC token que npm valida

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: npm@latest (12.x) exige node ^22.22 — con Node 20 el
          # upgrade de npm fallaba con EBADENGINE y el publish nunca corría
          # (así se rompió el release de v2.2.0 hasta este fix).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # OIDC Trusted Publishing requiere npm 11.5.1+ (la integración con
      # GitHub OIDC se agregó ahí). Forzamos la última versión estable.
      - name: Upgrade npm to support OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Validate tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION no coincide con package.json $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test --if-present

      # Sin NODE_AUTH_TOKEN: npm CLI 11.5+ detecta el entorno de GitHub
      # Actions con id-token:write y solicita el token OIDC automáticamente.
      # --provenance es redundante con OIDC (ya viene firmado) pero lo
      # dejamos por explicit-ness.
      - name: Publish to npm (via OIDC)
        run: npm publish --provenance --access public

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md || echo "Release $VERSION" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: PrinklyPrint.js v${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
